name: mgla CI

on:
  push:
    paths:
      - "bitcoin/**"
      - "monero/**"
      - "network/**"
      - "shared/**"
      - "compose.yaml"
      - "run.sh"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "bitcoin/**"
      - "monero/**"
      - "network/**"
      - "shared/**"
      - "compose.yaml"
      - "run.sh"
      - ".github/workflows/ci.yml"
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  ALPINE_VERSION: 3.24
  MONERO_VERSION: v0.18.5.1
  MONERO_COMMIT: 4f92268d7c16741cfb41e5bbe2aa46cc260a9ea5
  ELECTRUM_VERSION: 4.8.3
  ELECTRUM_ARCHIVE_SHA256: df41fa82e579f720a3859bff9de09dd98bb93079b01fa2973b73fdbdbfde7288
  IMAGE_REGISTRY: ghcr.io/m0nokey
  GRYPE_VERSION: v0.118.0

jobs:
  quality:
    name: static validation
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Build and test the native Python resolver fix
        run: docker build --progress=plain -f shared/runtime/Dockerfile.python-socket shared

      - name: Test scratch runtime assembly
        run: |
          set -o pipefail
          docker build --progress=plain -f shared/runtime/Dockerfile.stage-test shared 2>&1 | tee runtime-assembly-test.log

      - name: Upload failed runtime assembly log
        if: ${{ failure() && hashFiles('runtime-assembly-test.log') != '' }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.1
        with:
          name: runtime-assembly-test-log
          path: runtime-assembly-test.log
          retention-days: 7

      - name: Install validation tools
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libssl-dev \
            libsodium-dev \
            pkg-config \
            shellcheck
          tool_bin="${RUNNER_TEMP}/bin"
          mkdir -p "${tool_bin}"
          GOBIN="${tool_bin}" go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "${tool_bin}" >> "${GITHUB_PATH}"
          cargo install cargo-audit --locked --version 0.22.2

      - name: Lint GitHub Actions workflows
        run: actionlint -color

      - name: Lint shell scripts
        run: |
          set -euo pipefail
          mapfile -t shell_files < <(
            find bitcoin monero network shared/lib shared/vault shared/runtime -type f -name '*.sh' -print
            printf '%s\n' run.sh
          )
          test "${#shell_files[@]}" -gt 0
          # Follow the checked-in shared source modules and their contracts.
          shellcheck --external-sources --severity=warning "${shell_files[@]}"

      - name: Test shared vault launcher lifecycle
        run: bash shared/vault/launcher-test.sh

      - name: Test Tor route retry behavior
        run: bash shared/lib/tor-route-test.sh

      - name: Validate Monero Compose profile
        run: |
          set -euxo pipefail
          export exit_a_container=mgla-exit-a
          export exit_b_container=mgla-exit-b
          export haproxy_container=mgla-haproxy
          export monero_container=mgla-monero
          export bitcoin_container=mgla-bitcoin
          export exit_image=mgla-exit:lint
          export haproxy_image=mgla-haproxy:lint
          export monero_image=mgla-monero:lint
          export bitcoin_image=mgla-bitcoin:lint
          export vault_image=mgla-vault:lint
          export alpine_version="${ALPINE_VERSION}"
          export monero_version="${MONERO_VERSION}"
          export monero_commit="${MONERO_COMMIT}"
          export electrum_version="${ELECTRUM_VERSION}"
          export electrum_archive_sha256="${ELECTRUM_ARCHIVE_SHA256}"
          export wallet_store_host_dir=/tmp/mgla-wallets
          export wallet_vault_size=128M
          export ext_network_container_subnet_cidr_ipv4=10.90.0.0/29
          export ext_network_container_gateway_ipv4=10.90.0.1
          export ext_network_container_exit_a_ipv4=10.90.0.2
          export ext_network_container_exit_b_ipv4=10.90.0.3
          export int_network_container_subnet_cidr_ipv4=10.91.0.0/29
          export int_network_container_gateway_ipv4=10.91.0.1
          export int_network_container_exit_a_ipv4=10.91.0.2
          export int_network_container_exit_b_ipv4=10.91.0.3
          export int_network_container_haproxy_ipv4=10.91.0.4
          export int_network_container_app_ipv4=10.91.0.5
          docker compose --ansi never --profile monero --profile vault -f compose.yaml config --quiet

      - name: Validate Bitcoin Compose profile
        run: |
          set -euxo pipefail
          export exit_a_container=mgla-exit-a
          export exit_b_container=mgla-exit-b
          export haproxy_container=mgla-haproxy
          export monero_container=mgla-monero
          export bitcoin_container=mgla-bitcoin
          export exit_image=mgla-exit:lint
          export haproxy_image=mgla-haproxy:lint
          export monero_image=mgla-monero:lint
          export bitcoin_image=mgla-bitcoin:lint
          export vault_image=mgla-vault:lint
          export alpine_version="${ALPINE_VERSION}"
          export monero_version="${MONERO_VERSION}"
          export monero_commit="${MONERO_COMMIT}"
          export electrum_version="${ELECTRUM_VERSION}"
          export electrum_archive_sha256="${ELECTRUM_ARCHIVE_SHA256}"
          export wallet_store_host_dir=/tmp/mgla-bitcoin-wallets
          export wallet_vault_size=128M
          export ext_network_container_subnet_cidr_ipv4=10.90.0.0/29
          export ext_network_container_gateway_ipv4=10.90.0.1
          export ext_network_container_exit_a_ipv4=10.90.0.2
          export ext_network_container_exit_b_ipv4=10.90.0.3
          export int_network_container_subnet_cidr_ipv4=10.91.0.0/29
          export int_network_container_gateway_ipv4=10.91.0.1
          export int_network_container_exit_a_ipv4=10.91.0.2
          export int_network_container_exit_b_ipv4=10.91.0.3
          export int_network_container_haproxy_ipv4=10.91.0.4
          export int_network_container_app_ipv4=10.91.0.5
          docker compose --ansi never --profile bitcoin --profile vault -f compose.yaml config --quiet

      - name: Compile Python helpers
        run: python3 -m py_compile shared/ci/security-summary.py shared/ci/image-vex.py bitcoin/network-check.py bitcoin/prune-runtime.py network/exit/ci-monitor-test.py shared/runtime/minimize-busybox.py shared/runtime/build-python-socket.py shared/runtime/verify-socket.py shared/runtime/stage-runtime.py shared/runtime/stage-runtime-test.py

      - name: Check Rust formatting
        run: cargo fmt --manifest-path shared/vault/Cargo.toml -- --check

      - name: Run Rust Clippy
        run: >-
          cargo clippy
          --manifest-path shared/vault/Cargo.toml
          --locked
          --all-targets
          --
          -D warnings

      - name: Audit Rust dependencies
        working-directory: shared/vault
        run: cargo audit

      - name: Install latest stable Trivy from GitHub Releases
        shell: bash
        run: |
          set -euo pipefail
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "${tmp_dir}"' EXIT
          cd "${tmp_dir}"

          curl --fail --silent --show-error --location --retry 3 --retry-all-errors \
            --connect-timeout 10 --max-time 120 \
            https://api.github.com/repos/aquasecurity/trivy/releases/latest -o release.json
          version="$(jq -er '.tag_name | select(test("^v[0-9]+[.][0-9]+[.][0-9]+$"))' release.json)"
          asset="trivy_${version#v}_Linux-64bit.tar.gz"
          digest="$(jq -er --arg asset "${asset}" \
            '.assets[] | select(.name == $asset) | .digest | select(test("^sha256:[a-f0-9]{64}$"))' release.json)"
          curl --fail --silent --show-error --location --retry 3 --retry-all-errors \
            --connect-timeout 10 --max-time 120 \
            "https://github.com/aquasecurity/trivy/releases/download/${version}/${asset}" -o "${asset}"
          printf '%s  %s\n' "${digest#sha256:}" "${asset}" | sha256sum -c -
          mkdir -p "${RUNNER_TEMP}/trivy-bin"
          tar -xzf "${asset}" -C "${RUNNER_TEMP}/trivy-bin" trivy
          printf '%s\n' "${RUNNER_TEMP}/trivy-bin" >> "${GITHUB_PATH}"

      - name: Scan Docker and Compose configuration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          scanners: misconfig
          format: table
          exit-code: "1"
          severity: MEDIUM,HIGH,CRITICAL
          skip-setup-trivy: true

      - name: Scan repository for secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          format: table
          exit-code: "1"
          skip-setup-trivy: true

  osv-scan:
    name: OSV dependency scan
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
    with:
      scan-args: |-
        --include-git-root
        -r
        ./
      results-file-name: osv.sarif
      upload-sarif: true
      fail-on-vuln: true
      runs-on: ubuntu-24.04

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build_mode: none
          - language: python
            build_mode: none
          - language: rust
            build_mode: none

    steps:
      - name: Check out source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build_mode }}

      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          category: /language:${{ matrix.language }}
          upload: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'always' || 'never' }}

  build-test-scan:
    name: build test scan
    if: github.event_name != 'schedule'
    needs: [quality, osv-scan, codeql]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - architecture: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Check out source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Set up BuildKit
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build and run Monero integration checks
        env:
          CI: "1"
          IMAGE_MODE: build
          IMAGE_TAG: ${{ github.sha }}-${{ matrix.architecture }}
          DOCKER_DEFAULT_PLATFORM: ${{ matrix.platform }}
        run: |
          set -o pipefail
          bash monero/monero-cli.sh 2>&1 | tee monero-integration.log

      - name: Build and run Bitcoin integration checks
        env:
          CI: "1"
          IMAGE_MODE: build
          IMAGE_TAG: ${{ github.sha }}-${{ matrix.architecture }}
          DOCKER_DEFAULT_PLATFORM: ${{ matrix.platform }}
        run: |
          set -o pipefail
          bash bitcoin/bitcoin-cli.sh 2>&1 | tee bitcoin-integration.log

      - name: Upload failed integration logs
        if: failure()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: scratch-integration-logs-${{ matrix.architecture }}
          path: '*-integration.log'
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify wallet and network runtime contents
        env:
          IMAGE_TAG: ${{ github.sha }}-${{ matrix.architecture }}
        run: |
          set -euo pipefail
          for image in exit haproxy monero bitcoin; do
            docker run --rm --network none --entrypoint /bin/sh \
              "${IMAGE_REGISTRY}/mgla-${image}:${IMAGE_TAG}" -ec \
              'set -eu
               applets="$(busybox --list)"
               for command in wget nc telnet httpd ftpd tftp; do
                 if printf "%s\n" "$applets" | grep -qx "$command"; then
                   echo "Unexpected BusyBox applet: $command" >&2; exit 1
                 fi
               done
               for command in apk sqlite3 openssl gcc cc make git lddtree lddtreepax scanelf; do
                 if command -v "$command"; then
                   echo "Unexpected runtime command: $command" >&2; exit 1
                 fi
               done
               test -f /usr/share/zoneinfo/UTC
               test "$(find /usr/share/zoneinfo -type f | wc -l)" -eq 1
               test "$(cat /etc/timezone)" = UTC
               test "$(id -u)" -ne 0
               test ! -d /etc/apk
               test -s /usr/share/mgla/runtime-packages.json
               test -s /lib/apk/db/installed'
          done
          for wallet in monero bitcoin; do
            docker run --rm --network none --entrypoint /bin/sh \
              "${IMAGE_REGISTRY}/mgla-${wallet}:${IMAGE_TAG}" -ec \
              'test "$(id -u)" = 1000'
          done
          docker run --rm --network none --entrypoint /bin/sh \
            "${IMAGE_REGISTRY}/mgla-monero:${IMAGE_TAG}" -ec \
            'if command -v python3; then echo "Build-only Python leaked into Monero" >&2; exit 1; fi'
          docker run --rm --network none --entrypoint /opt/venv/bin/python \
            "${IMAGE_REGISTRY}/mgla-bitcoin:${IMAGE_TAG}" -c '
          import json
          from pathlib import Path
          import electrum
          root = Path(electrum.__file__).parent
          assert not (root / "gui/qt").exists()
          assert not (root / "gui/qml").exists()
          for manifest in (root / "plugins").glob("*/manifest.json"):
              keystore = json.loads(manifest.read_text()).get("registers_keystore", [])
              assert not keystore or keystore[0] != "hardware", manifest
          print("Electrum software-wallet runtime verified")'

      - name: Prepare security report directory
        run: mkdir -p grype-reports security-reports

      - name: Generate exit Grype security report
        id: grype_exit
        continue-on-error: true
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ghcr.io/m0nokey/mgla-exit:${{ github.sha }}-${{ matrix.architecture }}
          output-format: sarif
          output-file: grype-reports/grype-exit-${{ matrix.architecture }}.sarif
          fail-build: false
          severity-cutoff: critical
          only-fixed: false
          grype-version: ${{ env.GRYPE_VERSION }}
          # The matrix invokes Grype concurrently; its immutable shared cache
          # key causes harmless cache-reservation warnings in the UI. Grype
          # still keeps and reuses its database locally on this runner.
          cache-db: false

      - name: Check exit image for fixable vulnerabilities with Grype
        id: grype_exit_gate
        continue-on-error: true
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ghcr.io/m0nokey/mgla-exit:${{ github.sha }}-${{ matrix.architecture }}
          output-format: table
          fail-build: true
          severity-cutoff: medium
          only-fixed: true
          grype-version: ${{ env.GRYPE_VERSION }}
          cache-db: false

      - name: Generate HAProxy Grype security report
        id: grype_haproxy
        continue-on-error: true
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ghcr.io/m0nokey/mgla-haproxy:${{ github.sha }}-${{ matrix.architecture }}
          output-format: sarif
          output-file: grype-reports/grype-haproxy-${{ matrix.architecture }}.sarif
          fail-build: false
          severity-cutoff: critical
          only-fixed: false
          grype-version: ${{ env.GRYPE_VERSION }}
          cache-db: false

      - name: Check HAProxy image for fixable vulnerabilities with Grype
        id: grype_haproxy_gate
        continue-on-error: true
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ghcr.io/m0nokey/mgla-haproxy:${{ github.sha }}-${{ matrix.architecture }}
          output-format: table
          fail-build: true
          severity-cutoff: medium
          only-fixed: true
          grype-version: ${{ env.GRYPE_VERSION }}
          cache-db: false

      - name: Generate Monero Grype security report
        id: grype_monero
        continue-on-error: true
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ghcr.io/m0nokey/mgla-monero:${{ github.sha }}-${{ matrix.architecture }}
          output-format: sarif
          output-file: grype-reports/grype-monero-${{ matrix.architecture }}.sarif
          fail-build: false
          severity-cutoff: critical
          only-fixed: false
          grype-version: ${{ env.GRYPE_VERSION }}
          cache-db: false

      - name: Check Monero image for fixable vulnerabilities with Grype
        id: grype_monero_gate
        continue-on-error: true
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ghcr.io/m0nokey/mgla-monero:${{ github.sha }}-${{ matrix.architecture }}
          output-format: table
          fail-build: true
          severity-cutoff: medium
          only-fixed: true
          grype-version: ${{ env.GRYPE_VERSION }}
          cache-db: false

      - name: Generate Bitcoin Grype security report
        id: grype_bitcoin
        continue-on-error: true
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ghcr.io/m0nokey/mgla-bitcoin:${{ github.sha }}-${{ matrix.architecture }}
          output-format: sarif
          output-file: grype-reports/grype-bitcoin-${{ matrix.architecture }}.sarif
          fail-build: false
          severity-cutoff: critical
          only-fixed: false
          grype-version: ${{ env.GRYPE_VERSION }}
          cache-db: false

      - name: Check Bitcoin image for fixable vulnerabilities with Grype
        id: grype_bitcoin_gate
        continue-on-error: true
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ghcr.io/m0nokey/mgla-bitcoin:${{ github.sha }}-${{ matrix.architecture }}
          output-format: table
          fail-build: true
          severity-cutoff: medium
          only-fixed: true
          grype-version: ${{ env.GRYPE_VERSION }}
          cache-db: false

      - name: Publish security summary
        if: success()
        run: python3 shared/ci/security-summary.py

      - name: Download Grype for verified VEX reports
        id: grype_vex
        uses: anchore/scan-action/download-grype@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          grype-version: ${{ env.GRYPE_VERSION }}
          cache-db: false

      - name: Verify VEX statements and scan images
        env:
          GRYPE: ${{ steps.grype_vex.outputs.cmd }}
          ARCHITECTURE: ${{ matrix.architecture }}
          IMAGE_TAG: ${{ github.sha }}-${{ matrix.architecture }}
        run: |
          bash shared/ci/scan-images.sh "${GRYPE}" "${ARCHITECTURE}" "${IMAGE_TAG}" exit haproxy monero bitcoin
          python3 shared/ci/security-summary.py grype-verified

      - name: Upload raw Grype reports and VEX statements
        if: ${{ always() && hashFiles('grype-audit/*.json') != '' }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.1
        with:
          name: grype-audit-${{ matrix.architecture }}
          path: |
            grype-reports/*.sarif
            grype-audit/*.json
          if-no-files-found: error
          retention-days: 30

      - name: Stage security reports
        if: success()
        run: |
          set -euo pipefail
          mkdir -p security-reports
          find grype-verified -maxdepth 1 -type f -name '*.sarif' -exec cp {} security-reports/ \;
          test -n "$(find security-reports -maxdepth 1 -type f -name '*.sarif' -print -quit)"

      - name: Upload security report artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.1
        with:
          name: security-reports-${{ matrix.architecture }}
          path: security-reports/*.sarif
          if-no-files-found: error
          retention-days: 30

      - name: Enforce image security scan results
        if: always()
        env:
          GRYPE_EXIT_REPORT: ${{ steps.grype_exit.outcome }}
          GRYPE_HAPROXY_REPORT: ${{ steps.grype_haproxy.outcome }}
          GRYPE_MONERO_REPORT: ${{ steps.grype_monero.outcome }}
          GRYPE_BITCOIN_REPORT: ${{ steps.grype_bitcoin.outcome }}
          GRYPE_EXIT_GATE: ${{ steps.grype_exit_gate.outcome }}
          GRYPE_HAPROXY_GATE: ${{ steps.grype_haproxy_gate.outcome }}
          GRYPE_MONERO_GATE: ${{ steps.grype_monero_gate.outcome }}
          GRYPE_BITCOIN_GATE: ${{ steps.grype_bitcoin_gate.outcome }}
        run: |
          set -euo pipefail
          if [[ "${GRYPE_EXIT_REPORT}" == failure ||
            "${GRYPE_HAPROXY_REPORT}" == failure ||
            "${GRYPE_MONERO_REPORT}" == failure ||
            "${GRYPE_BITCOIN_REPORT}" == failure ||
            "${GRYPE_EXIT_GATE}" == failure ||
            "${GRYPE_HAPROXY_GATE}" == failure ||
            "${GRYPE_MONERO_GATE}" == failure ||
            "${GRYPE_BITCOIN_GATE}" == failure ]]; then
            echo "image security scanner failed or found a fixable medium, high, or critical vulnerability" >&2
            exit 1
          fi

      - name: Export architecture images
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          IMAGE_TAG: ${{ github.sha }}-${{ matrix.architecture }}
        run: |
          set -euxo pipefail
          docker save \
            "${IMAGE_REGISTRY}/mgla-exit:${IMAGE_TAG}" \
            "${IMAGE_REGISTRY}/mgla-haproxy:${IMAGE_TAG}" \
            "${IMAGE_REGISTRY}/mgla-monero:${IMAGE_TAG}" \
            "${IMAGE_REGISTRY}/mgla-bitcoin:${IMAGE_TAG}" \
            | gzip -1 > "mgla-images-${{ matrix.architecture }}.tar.gz"

      - name: Upload architecture images
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.1
        with:
          name: build-images-${{ matrix.architecture }}
          path: mgla-images-${{ matrix.architecture }}.tar.gz
          if-no-files-found: error
          retention-days: 1

  upload-security-reports:
    name: upload security reports
    needs: build-test-scan
    if: >-
      needs.build-test-scan.result == 'success' &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        image: [exit, haproxy, monero, bitcoin]
        architecture: [amd64, arm64]

    steps:
      - name: Download security reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          pattern: security-reports-*
          path: security-reports
          merge-multiple: true

      - name: Upload SARIF report
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: security-reports/grype-${{ matrix.image }}-${{ matrix.architecture }}.sarif
          category: mgla-grype-${{ matrix.image }}-${{ matrix.architecture }}

  publish:
    name: publish latest multi-architecture images
    needs: build-test-scan
    if: >-
      needs.build-test-scan.result == 'success' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      packages: write

    steps:
      - name: Download architecture images
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          pattern: build-images-*
          path: image-artifacts
          merge-multiple: true

      - name: Load architecture images
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(image-artifacts/*.tar.gz)
          test "${#archives[@]}" -eq 2
          for archive in "${archives[@]}"; do
            gzip -dc "${archive}" | docker load
          done

      - name: Set up BuildKit
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: m0nokey
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push architecture images
        env:
          SOURCE_TAG: ${{ github.sha }}
        run: |
          set -euxo pipefail
          push_image() {
            local image_ref="$1"
            local attempt
            for attempt in 1 2 3 4 5; do
              if docker push "${image_ref}"; then
                return 0
              fi
              if (( attempt == 5 )); then
                echo "docker push failed after ${attempt} attempts: ${image_ref}" >&2
                return 1
              fi
              echo "docker push failed (attempt ${attempt}/5); retrying ${image_ref}" >&2
              sleep $((attempt * 5))
            done
          }

          for architecture in amd64 arm64; do
            for image in exit haproxy monero bitcoin; do
              push_image "${IMAGE_REGISTRY}/mgla-${image}:${SOURCE_TAG}-${architecture}"
            done
          done

      - name: Verify architecture tags exist
        env:
          SOURCE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          for image in exit haproxy monero bitcoin; do
            for architecture in amd64 arm64; do
              docker buildx imagetools inspect \
                "${IMAGE_REGISTRY}/mgla-${image}:${SOURCE_TAG}-${architecture}" >/dev/null
            done
          done

      - name: Publish multi-architecture manifests
        env:
          SOURCE_TAG: ${{ github.sha }}
        run: |
          set -euxo pipefail
          for image in exit haproxy monero bitcoin; do
            docker buildx imagetools create \
              --tag "${IMAGE_REGISTRY}/mgla-${image}:latest" \
              "${IMAGE_REGISTRY}/mgla-${image}:${SOURCE_TAG}-amd64" \
              "${IMAGE_REGISTRY}/mgla-${image}:${SOURCE_TAG}-arm64"
          done

      - name: Resolve latest and current architecture digests
        id: latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          latest_shas=""
          for package in mgla-exit mgla-haproxy mgla-monero mgla-bitcoin; do
            digests="$(gh api \
              "user/packages/container/${package}/versions?per_page=100" \
              --jq "[.[] | select((.metadata.container.tags // []) | any(.[]; . == \"latest\" or . == \"${SOURCE_TAG}-amd64\" or . == \"${SOURCE_TAG}-arm64\")) | .name] | join(\",\")")"
            test -n "${digests}"
            latest_shas="${latest_shas}${latest_shas:+,}${digests}"
          done
          echo "shas=${latest_shas}" >> "${GITHUB_OUTPUT}"

      - name: Clean old GHCR versions
        uses: snok/container-retention-policy@d3bdcf5ce9b05f685154e4a16c39233b245e3d53 # v3.1.0
        with:
          account: user
          token: ${{ secrets.GITHUB_TOKEN }}
          image-names: "mgla-exit mgla-haproxy mgla-monero mgla-bitcoin"
          tag-selection: both
          cut-off: 1s
          skip-shas: ${{ steps.latest.outputs.shas }}

  rescan-latest:
    name: rescan latest images
    if: github.event_name == 'schedule'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: exit
            architecture: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - image: exit
            architecture: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - image: haproxy
            architecture: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - image: haproxy
            architecture: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - image: monero
            architecture: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - image: monero
            architecture: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - image: bitcoin
            architecture: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - image: bitcoin
            architecture: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Check out source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: m0nokey
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull latest image
        run: |
          set -euxo pipefail
          docker pull --platform "${{ matrix.platform }}" \
            "${IMAGE_REGISTRY}/mgla-${{ matrix.image }}:latest"

      - name: Prepare rescan reports
        run: mkdir -p grype-reports

      - name: Check latest image with Grype
        id: grype_report
        continue-on-error: true
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ghcr.io/m0nokey/mgla-${{ matrix.image }}:latest
          output-format: sarif
          output-file: grype-reports/grype-${{ matrix.image }}-${{ matrix.architecture }}.sarif
          fail-build: false
          severity-cutoff: critical
          only-fixed: false
          grype-version: ${{ env.GRYPE_VERSION }}
          cache-db: false

      - name: Check latest image for fixable vulnerabilities with Grype
        id: grype_gate
        continue-on-error: true
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ghcr.io/m0nokey/mgla-${{ matrix.image }}:latest
          output-format: table
          fail-build: true
          severity-cutoff: medium
          only-fixed: true
          grype-version: ${{ env.GRYPE_VERSION }}
          cache-db: false

      - name: Publish rescan summary
        if: always()
        run: python3 shared/ci/security-summary.py

      - name: Download Grype for verified VEX reports
        id: grype_vex
        uses: anchore/scan-action/download-grype@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          grype-version: ${{ env.GRYPE_VERSION }}
          cache-db: false

      - name: Verify VEX statements and rescan latest image
        env:
          GRYPE: ${{ steps.grype_vex.outputs.cmd }}
          ARCHITECTURE: ${{ matrix.architecture }}
          IMAGE_NAME: ${{ matrix.image }}
        run: |
          bash shared/ci/scan-images.sh "${GRYPE}" "${ARCHITECTURE}" latest "${IMAGE_NAME}"
          python3 shared/ci/security-summary.py grype-verified

      - name: Upload latest raw Grype reports and VEX statements
        if: ${{ always() && hashFiles('grype-audit/*.json') != '' }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.1
        with:
          name: grype-audit-latest-${{ matrix.image }}-${{ matrix.architecture }}
          path: |
            grype-reports/*.sarif
            grype-audit/*.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload latest Grype SARIF
        if: ${{ always() && hashFiles(format('grype-verified/grype-{0}-{1}.sarif', matrix.image, matrix.architecture)) != '' }}
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: grype-verified/grype-${{ matrix.image }}-${{ matrix.architecture }}.sarif
          category: mgla-latest-grype-${{ matrix.image }}-${{ matrix.architecture }}

      - name: Fail on latest release blockers
        if: always()
        env:
          GRYPE_REPORT_OUTCOME: ${{ steps.grype_report.outcome }}
          GRYPE_GATE_OUTCOME: ${{ steps.grype_gate.outcome }}
        run: |
          set -euo pipefail
          if [[ "${GRYPE_REPORT_OUTCOME}" == failure ||
            "${GRYPE_GATE_OUTCOME}" == failure ]]; then
            echo "latest image scan found a fixable medium, high, or critical vulnerability or scanner failure" >&2
            exit 1
          fi
