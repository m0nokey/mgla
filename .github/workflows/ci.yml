name: mgla CI

on:
  push:
    paths:
      - "bitcoin/**"
      - "monero/**"
      - "network/**"
      - "shared/**"
      - "compose.yaml"
      - "run.sh"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "bitcoin/**"
      - "monero/**"
      - "network/**"
      - "shared/**"
      - "compose.yaml"
      - "run.sh"
      - ".github/workflows/ci.yml"
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  ALPINE_VERSION: 3.24
  MONERO_VERSION: v0.18.5.1
  MONERO_COMMIT: 4f92268d7c16741cfb41e5bbe2aa46cc260a9ea5
  ELECTRUM_VERSION: 4.8.2
  ELECTRUM_ARCHIVE_SHA256: f38cee333c866986cdfb304428fa7487affc429c3853fc80e9822bd420bbc229
  IMAGE_REGISTRY: ghcr.io/m0nokey
  GRYPE_VERSION: v0.118.0

jobs:
  quality:
    name: static validation
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Install validation tools
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libssl-dev \
            libsodium-dev \
            pkg-config \
            shellcheck
          tool_bin="${RUNNER_TEMP}/bin"
          mkdir -p "${tool_bin}"
          GOBIN="${tool_bin}" go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "${tool_bin}" >> "${GITHUB_PATH}"
          cargo install cargo-audit --locked --version 0.22.2

      - name: Lint GitHub Actions workflows
        run: actionlint -color

      - name: Lint shell scripts
        run: |
          set -euo pipefail
          mapfile -t shell_files < <(
            find bitcoin monero network shared/lib shared/vault -type f -name '*.sh' -print
            printf '%s\n' run.sh
          )
          test "${#shell_files[@]}" -gt 0
          # Follow the checked-in shared source modules and their contracts.
          shellcheck --external-sources --severity=warning "${shell_files[@]}"

      - name: Validate Monero Compose profile
        run: |
          set -euxo pipefail
          export exit_a_container=mgla-exit-a
          export exit_b_container=mgla-exit-b
          export haproxy_container=mgla-haproxy
          export monero_container=mgla-monero
          export bitcoin_container=mgla-bitcoin
          export exit_image=mgla-exit:lint
          export haproxy_image=mgla-haproxy:lint
          export monero_image=mgla-monero:lint
          export bitcoin_image=mgla-bitcoin:lint
          export alpine_version="${ALPINE_VERSION}"
          export monero_version="${MONERO_VERSION}"
          export monero_commit="${MONERO_COMMIT}"
          export electrum_version="${ELECTRUM_VERSION}"
          export electrum_archive_sha256="${ELECTRUM_ARCHIVE_SHA256}"
          export wallet_store_host_dir=/tmp/mgla-wallets
          export wallet_vault_size=128M
          export ext_network_container_subnet_cidr_ipv4=10.90.0.0/29
          export ext_network_container_gateway_ipv4=10.90.0.1
          export ext_network_container_exit_a_ipv4=10.90.0.2
          export ext_network_container_exit_b_ipv4=10.90.0.3
          export int_network_container_subnet_cidr_ipv4=10.91.0.0/29
          export int_network_container_gateway_ipv4=10.91.0.1
          export int_network_container_exit_a_ipv4=10.91.0.2
          export int_network_container_exit_b_ipv4=10.91.0.3
          export int_network_container_haproxy_ipv4=10.91.0.4
          export int_network_container_app_ipv4=10.91.0.5
          docker compose --ansi never --profile monero -f compose.yaml config --quiet

      - name: Validate Bitcoin Compose profile
        run: |
          set -euxo pipefail
          export exit_a_container=mgla-exit-a
          export exit_b_container=mgla-exit-b
          export haproxy_container=mgla-haproxy
          export monero_container=mgla-monero
          export bitcoin_container=mgla-bitcoin
          export exit_image=mgla-exit:lint
          export haproxy_image=mgla-haproxy:lint
          export monero_image=mgla-monero:lint
          export bitcoin_image=mgla-bitcoin:lint
          export alpine_version="${ALPINE_VERSION}"
          export monero_version="${MONERO_VERSION}"
          export monero_commit="${MONERO_COMMIT}"
          export electrum_version="${ELECTRUM_VERSION}"
          export electrum_archive_sha256="${ELECTRUM_ARCHIVE_SHA256}"
          export wallet_store_host_dir=/tmp/mgla-bitcoin-wallets
          export wallet_vault_size=128M
          export ext_network_container_subnet_cidr_ipv4=10.90.0.0/29
          export ext_network_container_gateway_ipv4=10.90.0.1
          export ext_network_container_exit_a_ipv4=10.90.0.2
          export ext_network_container_exit_b_ipv4=10.90.0.3
          export int_network_container_subnet_cidr_ipv4=10.91.0.0/29
          export int_network_container_gateway_ipv4=10.91.0.1
          export int_network_container_exit_a_ipv4=10.91.0.2
          export int_network_container_exit_b_ipv4=10.91.0.3
          export int_network_container_haproxy_ipv4=10.91.0.4
          export int_network_container_app_ipv4=10.91.0.5
          docker compose --ansi never --profile bitcoin -f compose.yaml config --quiet

      - name: Compile Python helpers
        run: python3 -m py_compile shared/ci/security-summary.py bitcoin/network-check.py

      - name: Check Rust formatting
        run: cargo fmt --manifest-path shared/vault/Cargo.toml -- --check

      - name: Run Rust Clippy
        run: >-
          cargo clippy
          --manifest-path shared/vault/Cargo.toml
          --locked
          --all-targets
          --
          -D warnings

      - name: Audit Rust dependencies
        working-directory: shared/vault
        run: cargo audit

      - name: Scan Docker and Compose configuration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          scanners: misconfig
          format: table
          exit-code: "1"
          severity: MEDIUM,HIGH,CRITICAL
          version: v0.74.0

      - name: Scan repository for secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          format: table
          exit-code: "1"
          version: v0.74.0

  osv-scan:
    name: OSV dependency scan
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
    with:
      scan-args: |-
        --include-git-root
        -r
        ./
      results-file-name: osv.sarif
      upload-sarif: true
      fail-on-vuln: true
      runs-on: ubuntu-24.04


  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build_mode: none
          - language: python
            build_mode: none
          - language: rust
            build_mode: none

    steps:
      - name: Check out source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build_mode }}

      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          category: /language:${{ matrix.language }}
          upload: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'always' || 'never' }}

  build-test-scan:
    name: build test scan
    if: github.event_name != 'schedule'
    needs: [quality, osv-scan, codeql]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - architecture: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Check out source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Set up BuildKit
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build and run Monero integration checks
        env:
          CI: "1"
          IMAGE_MODE: build
          IMAGE_TAG: ${{ github.sha }}-${{ matrix.architecture }}
          DOCKER_DEFAULT_PLATFORM: ${{ matrix.platform }}
        run: bash monero/monero-cli.sh

      - name: Build and run Bitcoin integration checks
        env:
          CI: "1"
          IMAGE_MODE: build
          IMAGE_TAG: ${{ github.sha }}-${{ matrix.architecture }}
          DOCKER_DEFAULT_PLATFORM: ${{ matrix.platform }}
        run: bash bitcoin/bitcoin-cli.sh

      - name: Prepare security report directory
        run: mkdir -p trivy-reports grype-reports security-reports

      - name: Generate exit security report
        id: trivy_exit_report
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ghcr.io/m0nokey/mgla-exit:${{ github.sha }}-${{ matrix.architecture }}
          format: sarif
          output: trivy-reports/trivy-exit-${{ matrix.architecture }}.sarif
          exit-code: "0"
          ignore-unfixed: false
          vuln-type: os,library
          scanners: vuln
          version: v0.74.0
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL

      - name: Generate HAProxy security report
        id: trivy_haproxy_report
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ghcr.io/m0nokey/mgla-haproxy:${{ github.sha }}-${{ matrix.architecture }}
          format: sarif
          output: trivy-reports/trivy-haproxy-${{ matrix.architecture }}.sarif
          exit-code: "0"
          ignore-unfixed: false
          vuln-type: os,library
          scanners: vuln
          version: v0.74.0
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL

      - name: Generate Monero security report
        id: trivy_monero_report
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ghcr.io/m0nokey/mgla-monero:${{ github.sha }}-${{ matrix.architecture }}
          format: sarif
          output: trivy-reports/trivy-monero-${{ matrix.architecture }}.sarif
          exit-code: "0"
          ignore-unfixed: false
          vuln-type: os,library
          scanners: vuln
          version: v0.74.0
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL

      - name: Generate Bitcoin security report
        id: trivy_bitcoin_report
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ghcr.io/m0nokey/mgla-bitcoin:${{ github.sha }}-${{ matrix.architecture }}
          format: sarif
          output: trivy-reports/trivy-bitcoin-${{ matrix.architecture }}.sarif
          exit-code: "0"
          ignore-unfixed: false
          vuln-type: os,library
          scanners: vuln
          version: v0.74.0
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL


      - name: Generate exit Grype security report
        id: grype_exit
        continue-on-error: true
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ghcr.io/m0nokey/mgla-exit:${{ github.sha }}-${{ matrix.architecture }}
          output-format: sarif
          output-file: grype-reports/grype-exit-${{ matrix.architecture }}.sarif
          fail-build: true
          severity-cutoff: medium
          only-fixed: true
          grype-version: ${{ env.GRYPE_VERSION }}
          cache-db: true

      - name: Generate HAProxy Grype security report
        id: grype_haproxy
        continue-on-error: true
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ghcr.io/m0nokey/mgla-haproxy:${{ github.sha }}-${{ matrix.architecture }}
          output-format: sarif
          output-file: grype-reports/grype-haproxy-${{ matrix.architecture }}.sarif
          fail-build: true
          severity-cutoff: medium
          only-fixed: true
          grype-version: ${{ env.GRYPE_VERSION }}
          cache-db: true

      - name: Generate Monero Grype security report
        id: grype_monero
        continue-on-error: true
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ghcr.io/m0nokey/mgla-monero:${{ github.sha }}-${{ matrix.architecture }}
          output-format: sarif
          output-file: grype-reports/grype-monero-${{ matrix.architecture }}.sarif
          fail-build: true
          severity-cutoff: medium
          only-fixed: true
          grype-version: ${{ env.GRYPE_VERSION }}
          cache-db: true

      - name: Generate Bitcoin Grype security report
        id: grype_bitcoin
        continue-on-error: true
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ghcr.io/m0nokey/mgla-bitcoin:${{ github.sha }}-${{ matrix.architecture }}
          output-format: sarif
          output-file: grype-reports/grype-bitcoin-${{ matrix.architecture }}.sarif
          fail-build: true
          severity-cutoff: medium
          only-fixed: true
          grype-version: ${{ env.GRYPE_VERSION }}
          cache-db: true

      - name: Publish security summary
        if: always()
        run: python3 shared/ci/security-summary.py

      - name: Stage security reports
        if: always()
        run: |
          set -euo pipefail
          mkdir -p security-reports
          find trivy-reports grype-reports -maxdepth 1 -type f -name '*.sarif' -exec cp {} security-reports/ \;
          test -n "$(find security-reports -maxdepth 1 -type f -name '*.sarif' -print -quit)"

      - name: Upload security report artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.1
        with:
          name: security-reports-${{ matrix.architecture }}
          path: security-reports/*.sarif
          if-no-files-found: error
          retention-days: 30

      - name: Scan exit image for release blockers
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ghcr.io/m0nokey/mgla-exit:${{ github.sha }}-${{ matrix.architecture }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          scanners: vuln
          version: v0.74.0
          severity: CRITICAL,HIGH,MEDIUM

      - name: Scan HAProxy image for release blockers
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ghcr.io/m0nokey/mgla-haproxy:${{ github.sha }}-${{ matrix.architecture }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          scanners: vuln
          version: v0.74.0
          severity: CRITICAL,HIGH,MEDIUM

      - name: Scan Monero image for release blockers
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ghcr.io/m0nokey/mgla-monero:${{ github.sha }}-${{ matrix.architecture }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          scanners: vuln
          version: v0.74.0
          severity: CRITICAL,HIGH,MEDIUM

      - name: Scan Bitcoin image for release blockers
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ghcr.io/m0nokey/mgla-bitcoin:${{ github.sha }}-${{ matrix.architecture }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          scanners: vuln
          version: v0.74.0
          severity: CRITICAL,HIGH,MEDIUM


      - name: Enforce image security scan results
        if: always()
        env:
          TRIVY_EXIT_REPORT: ${{ steps.trivy_exit_report.outcome }}
          TRIVY_HAPROXY_REPORT: ${{ steps.trivy_haproxy_report.outcome }}
          TRIVY_MONERO_REPORT: ${{ steps.trivy_monero_report.outcome }}
          TRIVY_BITCOIN_REPORT: ${{ steps.trivy_bitcoin_report.outcome }}
          GRYPE_EXIT: ${{ steps.grype_exit.outcome }}
          GRYPE_HAPROXY: ${{ steps.grype_haproxy.outcome }}
          GRYPE_MONERO: ${{ steps.grype_monero.outcome }}
          GRYPE_BITCOIN: ${{ steps.grype_bitcoin.outcome }}
        run: |
          set -euo pipefail
          if [[ "${TRIVY_EXIT_REPORT}" == failure ||
            "${TRIVY_HAPROXY_REPORT}" == failure ||
            "${TRIVY_MONERO_REPORT}" == failure ||
            "${TRIVY_BITCOIN_REPORT}" == failure ||
            "${GRYPE_EXIT}" == failure ||
            "${GRYPE_HAPROXY}" == failure ||
            "${GRYPE_MONERO}" == failure ||
            "${GRYPE_BITCOIN}" == failure ]]; then
            echo "image security scanner failed or found a fixable medium, high, or critical vulnerability" >&2
            exit 1
          fi

      - name: Export architecture images
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          IMAGE_TAG: ${{ github.sha }}-${{ matrix.architecture }}
        run: |
          set -euxo pipefail
          docker save \
            "${IMAGE_REGISTRY}/mgla-exit:${IMAGE_TAG}" \
            "${IMAGE_REGISTRY}/mgla-haproxy:${IMAGE_TAG}" \
            "${IMAGE_REGISTRY}/mgla-monero:${IMAGE_TAG}" \
            "${IMAGE_REGISTRY}/mgla-bitcoin:${IMAGE_TAG}" \
            | gzip -1 > "mgla-images-${{ matrix.architecture }}.tar.gz"

      - name: Upload architecture images
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.1
        with:
          name: build-images-${{ matrix.architecture }}
          path: mgla-images-${{ matrix.architecture }}.tar.gz
          if-no-files-found: error
          retention-days: 1

  upload-security-reports:
    name: upload security reports
    needs: build-test-scan
    if: >-
      needs.build-test-scan.result == 'success' &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        scanner: [trivy, grype]
        image: [exit, haproxy, monero, bitcoin]
        architecture: [amd64, arm64]

    steps:
      - name: Download security reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          pattern: security-reports-*
          path: security-reports
          merge-multiple: true

      - name: Upload SARIF report
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: security-reports/${{ matrix.scanner }}-${{ matrix.image }}-${{ matrix.architecture }}.sarif
          category: mgla-${{ matrix.scanner }}-${{ matrix.image }}-${{ matrix.architecture }}

  publish:
    name: publish latest multi-architecture images
    needs: build-test-scan
    if: >-
      needs.build-test-scan.result == 'success' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      packages: write

    steps:
      - name: Download architecture images
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          pattern: build-images-*
          path: image-artifacts
          merge-multiple: true

      - name: Load architecture images
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(image-artifacts/*.tar.gz)
          test "${#archives[@]}" -eq 2
          for archive in "${archives[@]}"; do
            gzip -dc "${archive}" | docker load
          done

      - name: Set up BuildKit
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: m0nokey
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push architecture images
        env:
          SOURCE_TAG: ${{ github.sha }}
        run: |
          set -euxo pipefail
          for architecture in amd64 arm64; do
            for image in exit haproxy monero bitcoin; do
              docker push "${IMAGE_REGISTRY}/mgla-${image}:${SOURCE_TAG}-${architecture}"
            done
          done

      - name: Verify architecture tags exist
        env:
          SOURCE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          for image in exit haproxy monero bitcoin; do
            for architecture in amd64 arm64; do
              docker buildx imagetools inspect \
                "${IMAGE_REGISTRY}/mgla-${image}:${SOURCE_TAG}-${architecture}" >/dev/null
            done
          done

      - name: Publish multi-architecture manifests
        env:
          SOURCE_TAG: ${{ github.sha }}
        run: |
          set -euxo pipefail
          for image in exit haproxy monero bitcoin; do
            docker buildx imagetools create \
              --tag "${IMAGE_REGISTRY}/mgla-${image}:latest" \
              "${IMAGE_REGISTRY}/mgla-${image}:${SOURCE_TAG}-amd64" \
              "${IMAGE_REGISTRY}/mgla-${image}:${SOURCE_TAG}-arm64"
          done

      - name: Resolve latest and current architecture digests
        id: latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          latest_shas=""
          for package in mgla-exit mgla-haproxy mgla-monero mgla-bitcoin; do
            digests="$(gh api \
              "user/packages/container/${package}/versions?per_page=100" \
              --jq "[.[] | select((.metadata.container.tags // []) | any(.[]; . == \"latest\" or . == \"${SOURCE_TAG}-amd64\" or . == \"${SOURCE_TAG}-arm64\")) | .name] | join(\",\")")"
            test -n "${digests}"
            latest_shas="${latest_shas}${latest_shas:+,}${digests}"
          done
          echo "shas=${latest_shas}" >> "${GITHUB_OUTPUT}"

      - name: Clean old GHCR versions
        uses: snok/container-retention-policy@d3bdcf5ce9b05f685154e4a16c39233b245e3d53 # v3.1.0
        with:
          account: user
          token: ${{ secrets.GITHUB_TOKEN }}
          image-names: "mgla-exit mgla-haproxy mgla-monero mgla-bitcoin"
          tag-selection: both
          cut-off: 1s
          skip-shas: ${{ steps.latest.outputs.shas }}

  rescan-latest:
    name: rescan latest images
    if: github.event_name == 'schedule'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: exit
            architecture: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - image: exit
            architecture: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - image: haproxy
            architecture: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - image: haproxy
            architecture: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - image: monero
            architecture: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - image: monero
            architecture: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - image: bitcoin
            architecture: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - image: bitcoin
            architecture: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Check out source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: m0nokey
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull latest image
        run: |
          set -euxo pipefail
          docker pull --platform "${{ matrix.platform }}" \
            "${IMAGE_REGISTRY}/mgla-${{ matrix.image }}:latest"

      - name: Prepare rescan reports
        run: mkdir -p trivy-reports grype-reports

      - name: Scan latest image
        id: trivy_report
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ghcr.io/m0nokey/mgla-${{ matrix.image }}:latest
          format: sarif
          output: trivy-reports/trivy-${{ matrix.image }}-${{ matrix.architecture }}.sarif
          exit-code: "0"
          ignore-unfixed: false
          vuln-type: os,library
          scanners: vuln
          version: v0.74.0
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL


      - name: Check latest image with Trivy
        id: trivy_blocker
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ghcr.io/m0nokey/mgla-${{ matrix.image }}:latest
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          scanners: vuln
          version: v0.74.0
          severity: CRITICAL,HIGH,MEDIUM

      - name: Check latest image with Grype
        id: grype
        continue-on-error: true
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ghcr.io/m0nokey/mgla-${{ matrix.image }}:latest
          output-format: sarif
          output-file: grype-reports/grype-${{ matrix.image }}-${{ matrix.architecture }}.sarif
          fail-build: true
          severity-cutoff: medium
          only-fixed: true
          grype-version: ${{ env.GRYPE_VERSION }}
          cache-db: true

      - name: Publish rescan summary
        if: always()
        run: python3 shared/ci/security-summary.py

      - name: Upload rescan SARIF
        if: ${{ always() && hashFiles(format('trivy-reports/trivy-{0}-{1}.sarif', matrix.image, matrix.architecture)) != '' }}
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: trivy-reports/trivy-${{ matrix.image }}-${{ matrix.architecture }}.sarif
          category: mgla-latest-${{ matrix.image }}-${{ matrix.architecture }}


      - name: Upload latest Grype SARIF
        if: ${{ always() && hashFiles(format('grype-reports/grype-{0}-{1}.sarif', matrix.image, matrix.architecture)) != '' }}
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: grype-reports/grype-${{ matrix.image }}-${{ matrix.architecture }}.sarif
          category: mgla-latest-grype-${{ matrix.image }}-${{ matrix.architecture }}

      - name: Fail on latest release blockers
        if: always()
        env:
          TRIVY_REPORT_OUTCOME: ${{ steps.trivy_report.outcome }}
          TRIVY_BLOCKER_OUTCOME: ${{ steps.trivy_blocker.outcome }}
          GRYPE_OUTCOME: ${{ steps.grype.outcome }}
        run: |
          set -euo pipefail
          if [[ "${TRIVY_REPORT_OUTCOME}" == failure ||
            "${TRIVY_BLOCKER_OUTCOME}" == failure ||
            "${GRYPE_OUTCOME}" == failure ]]; then
            echo "latest image scan found a fixable medium, high, or critical vulnerability or scanner failure" >&2
            exit 1
          fi
