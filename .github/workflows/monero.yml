name: Monero module

on:
  push:
    paths:
      - "monero/**"
      - "monero-cli.sh"
      - ".github/workflows/monero.yml"
  pull_request:
    paths:
      - "monero/**"
      - "monero-cli.sh"
      - ".github/workflows/monero.yml"
  workflow_dispatch:

permissions:
  contents: read

# The workflow validates local images only. Publishing will be a separate,
# explicitly authorized release workflow.
env:
  MONERO_VERSION: v0.18.5.1
  MONERO_COMMIT: 4f92268d7c16741cfb41e5bbe2aa46cc260a9ea5

jobs:
  build-test-scan:
    name: ${{ matrix.architecture }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            platform: linux/amd64
          - architecture: arm64
            platform: linux/arm64
    env:
      DOCKER_DEFAULT_PLATFORM: ${{ matrix.platform }}

    steps:
      - name: Check out source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up emulation
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0
        with:
          platforms: all

      - name: Set up BuildKit
        uses: docker/setup-buildx-action@18ce135bb5112fa8ce4ed6c17ab05699d7f3a5e0 # v3.11.0

      - name: Build and run integration checks
        run: |
          CI=1 bash monero-cli.sh

      - name: Scan exit image
        uses: docker/scout-action@c94507b5bf72bd25244caafe9d4dab09fa2d687b # v1.18.0
        with:
          command: cves
          image: local://mgla-exit
          only-severities: critical,high
          only-fixed: true
          exit-code: true

      - name: Scan HAProxy image
        uses: docker/scout-action@c94507b5bf72bd25244caafe9d4dab09fa2d687b # v1.18.0
        with:
          command: cves
          image: local://mgla-haproxy
          only-severities: critical,high
          only-fixed: true
          exit-code: true

      - name: Scan Monero image
        uses: docker/scout-action@c94507b5bf72bd25244caafe9d4dab09fa2d687b # v1.18.0
        with:
          command: cves
          image: local://mgla-monero
          only-severities: critical,high
          only-fixed: true
          exit-code: true
