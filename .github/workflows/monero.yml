name: Monero module

on:
  push:
    paths:
      - "monero/docker/**"
      - "monero/compose.yaml"
      - "monero/monero-cli.sh"
      - ".github/workflows/monero.yml"
  pull_request:
    paths:
      - "monero/docker/**"
      - "monero/compose.yaml"
      - "monero/monero-cli.sh"
      - ".github/workflows/monero.yml"
  workflow_dispatch:

permissions:
  contents: read

# Pull requests and non-main pushes validate local images only. Successful
# pushes to main publish multi-architecture images to GHCR.
env:
  MONERO_VERSION: v0.18.5.1
  MONERO_COMMIT: 4f92268d7c16741cfb41e5bbe2aa46cc260a9ea5
  IMAGE_REGISTRY: ghcr.io/m0nokey

jobs:
  build-test-scan:
    name: ${{ matrix.architecture }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    permissions:
      actions: read
      contents: read
      packages: write
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - architecture: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Check out source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up BuildKit
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build and run integration checks
        env:
          IMAGE_MODE: build
          IMAGE_TAG: ${{ github.sha }}-${{ matrix.architecture }}
        run: |
          CI=1 DOCKER_DEFAULT_PLATFORM="${{ matrix.platform }}" bash monero/monero-cli.sh

      - name: Prepare security report directory
        run: mkdir -p trivy-reports

      - name: Generate exit security report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ghcr.io/m0nokey/mgla-exit:${{ github.sha }}-${{ matrix.architecture }}
          format: sarif
          output: trivy-reports/exit-${{ matrix.architecture }}.sarif
          exit-code: "0"
          ignore-unfixed: false
          vuln-type: os,library
          scanners: vuln
          version: v0.74.0
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL

      - name: Generate HAProxy security report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ghcr.io/m0nokey/mgla-haproxy:${{ github.sha }}-${{ matrix.architecture }}
          format: sarif
          output: trivy-reports/haproxy-${{ matrix.architecture }}.sarif
          exit-code: "0"
          ignore-unfixed: false
          vuln-type: os,library
          scanners: vuln
          version: v0.74.0
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL

      - name: Generate Monero security report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ghcr.io/m0nokey/mgla-monero:${{ github.sha }}-${{ matrix.architecture }}
          format: sarif
          output: trivy-reports/monero-${{ matrix.architecture }}.sarif
          exit-code: "0"
          ignore-unfixed: false
          vuln-type: os,library
          scanners: vuln
          version: v0.74.0
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL

      - name: Publish security summary
        run: python3 monero/ci/security-summary.py

      - name: Upload security report artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.1
        with:
          name: security-reports-${{ matrix.architecture }}
          path: trivy-reports/*.sarif
          if-no-files-found: error
          retention-days: 30

      - name: Upload exit report to GitHub Security
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@311b4ee155dcdab395044f00946f664bd51ff173 # v4
        with:
          sarif_file: trivy-reports/exit-${{ matrix.architecture }}.sarif
          category: mgla-exit-${{ matrix.architecture }}

      - name: Upload HAProxy report to GitHub Security
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@311b4ee155dcdab395044f00946f664bd51ff173 # v4
        with:
          sarif_file: trivy-reports/haproxy-${{ matrix.architecture }}.sarif
          category: mgla-haproxy-${{ matrix.architecture }}

      - name: Upload Monero report to GitHub Security
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@311b4ee155dcdab395044f00946f664bd51ff173 # v4
        with:
          sarif_file: trivy-reports/monero-${{ matrix.architecture }}.sarif
          category: mgla-monero-${{ matrix.architecture }}

      - name: Scan exit image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ghcr.io/m0nokey/mgla-exit:${{ github.sha }}-${{ matrix.architecture }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          scanners: vuln
          version: v0.74.0
          severity: CRITICAL,HIGH

      - name: Scan HAProxy image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ghcr.io/m0nokey/mgla-haproxy:${{ github.sha }}-${{ matrix.architecture }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          scanners: vuln
          version: v0.74.0
          severity: CRITICAL,HIGH

      - name: Scan Monero image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ghcr.io/m0nokey/mgla-monero:${{ github.sha }}-${{ matrix.architecture }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          scanners: vuln
          version: v0.74.0
          severity: CRITICAL,HIGH

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: m0nokey
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push architecture images
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          IMAGE_TAG: ${{ github.sha }}-${{ matrix.architecture }}
        run: |
          set -eux
          docker push "${IMAGE_REGISTRY}/mgla-exit:${IMAGE_TAG}"
          docker push "${IMAGE_REGISTRY}/mgla-haproxy:${IMAGE_TAG}"
          docker push "${IMAGE_REGISTRY}/mgla-monero:${IMAGE_TAG}"

  publish:
    name: publish multi-architecture manifests
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build-test-scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write

    steps:
      - name: Set up BuildKit
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: m0nokey
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish multi-architecture manifests
        env:
          IMAGE_REGISTRY: ghcr.io/m0nokey
          SOURCE_TAG: ${{ github.sha }}
        run: |
          set -eux
          for image in exit haproxy monero; do
            docker buildx imagetools create \
              --tag "${IMAGE_REGISTRY}/mgla-${image}:latest" \
              "${IMAGE_REGISTRY}/mgla-${image}:${SOURCE_TAG}-amd64" \
              "${IMAGE_REGISTRY}/mgla-${image}:${SOURCE_TAG}-arm64"
          done

      - name: Resolve latest manifest digests
        id: latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          latest_shas=""
          for package in mgla-exit mgla-haproxy mgla-monero; do
            digest="$(gh api \
              "user/packages/container/${package}/versions?per_page=100" \
              --jq 'first(.[] | select((.metadata.container.tags // []) | index("latest")) | .name) // empty')"
            test -n "${digest}"
            latest_shas="${latest_shas}${latest_shas:+,}${digest}"
          done
          echo "shas=${latest_shas}" >> "${GITHUB_OUTPUT}"

      - name: Clean old GHCR versions
        uses: snok/container-retention-policy@d3bdcf5ce9b05f685154e4a16c39233b245e3d53 # v3.1.0
        with:
          account: user
          token: ${{ secrets.GITHUB_TOKEN }}
          image-names: "mgla-exit mgla-haproxy mgla-monero"
          tag-selection: both
          cut-off: 1s
          skip-shas: ${{ steps.latest.outputs.shas }}
