# Both wallet images use the shared vault's 1 GiB Argon2id working set.
# Keep headroom for the wallet process and future wallet modules.
x-mgla-vault-resources: &mgla-vault-resources
  mem_limit: 2g

services:
  exit_a:
    container_name: ${exit_a_container:-mgla-exit-a}
    image: ${exit_image:-mgla-exit:latest}
    logging:
      driver: "none"
    build:
      context: ./network/exit
      dockerfile: Dockerfile
    init: true
    stop_signal: SIGTERM
    stop_grace_period: 5s
    cap_drop: ["ALL"]
    read_only: true
    ipc: none
    security_opt:
      - no-new-privileges:true
    environment:
      EXIT_IP: "${int_network_container_exit_a_ipv4:?}"
      HAPROXY_IP: "${int_network_container_haproxy_ipv4:?}"
      TZ: UTC
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,mode=1777
      - /var/lib/tor:rw,nosuid,nodev,noexec,mode=1777
    volumes:
      - exit_a_run:/run/tor
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck"]
      interval: 30s
      timeout: 15s
      retries: 8
      start_period: 180s
    networks:
      external_network:
        ipv4_address: ${ext_network_container_exit_a_ipv4:?}
      internal_network:
        ipv4_address: ${int_network_container_exit_a_ipv4:?}

  exit_b:
    container_name: ${exit_b_container:-mgla-exit-b}
    image: ${exit_image:-mgla-exit:latest}
    logging:
      driver: "none"
    init: true
    stop_signal: SIGTERM
    stop_grace_period: 5s
    cap_drop: ["ALL"]
    read_only: true
    ipc: none
    security_opt:
      - no-new-privileges:true
    environment:
      EXIT_IP: "${int_network_container_exit_b_ipv4:?}"
      HAPROXY_IP: "${int_network_container_haproxy_ipv4:?}"
      TZ: UTC
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,mode=1777
      - /var/lib/tor:rw,nosuid,nodev,noexec,mode=1777
    volumes:
      - exit_b_run:/run/tor
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck"]
      interval: 30s
      timeout: 15s
      retries: 8
      start_period: 180s
    networks:
      external_network:
        ipv4_address: ${ext_network_container_exit_b_ipv4:?}
      internal_network:
        ipv4_address: ${int_network_container_exit_b_ipv4:?}

  haproxy:
    container_name: ${haproxy_container:-mgla-haproxy}
    image: ${haproxy_image:-mgla-haproxy:latest}
    logging:
      driver: "none"
    build:
      context: ./network/haproxy
      dockerfile: Dockerfile
    init: true
    stop_signal: SIGTERM
    stop_grace_period: 2s
    cap_drop: ["ALL"]
    read_only: true
    ipc: none
    pids_limit: 100
    security_opt:
      - no-new-privileges:true
    environment:
      HAPROXY_IP: "${int_network_container_haproxy_ipv4:?}"
      EXIT_A_IP: "${int_network_container_exit_a_ipv4:?}"
      EXIT_B_IP: "${int_network_container_exit_b_ipv4:?}"
      TZ: UTC
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,mode=1777
      - /run:rw,nosuid,nodev,noexec,mode=0755
    depends_on:
      - exit_a
      - exit_b
    volumes:
      - exit_a_run:/run/tor_a:ro
      - exit_b_run:/run/tor_b:ro
    networks:
      internal_network:
        ipv4_address: ${int_network_container_haproxy_ipv4:?}

  monero:
    <<: *mgla-vault-resources
    profiles: ["monero"]
    container_name: ${monero_container:-mgla-monero}
    image: ${monero_image:-mgla-monero:latest}
    logging:
      driver: "none"
    build:
      context: ./monero
      dockerfile: Dockerfile
      additional_contexts:
        shared: ./shared
      args:
        ALPINE_VERSION: "${alpine_version:-3.24}"
        MONERO_VERSION: "${monero_version:-v0.18.5.1}"
        MONERO_COMMIT: "${monero_commit:-4f92268d7c16741cfb41e5bbe2aa46cc260a9ea5}"
    init: true
    stop_signal: SIGTERM
    stop_grace_period: 30s
    user: "${monero_container_uid:-1000}:${monero_container_gid:-1000}"
    cap_drop: ["ALL"]
    read_only: true
    ipc: none
    pids_limit: 128
    cpus: "1.0"
    security_opt:
      - no-new-privileges:true
    environment:
      HAPROXY_IP: "${int_network_container_haproxy_ipv4:?}"
      HOME: /tmp/home
      WALLET_VAULT_HOST_DIR: "${wallet_store_host_dir:-/tmp/mgla-wallets}"
      WALLET_VAULT_SIZE: "${wallet_vault_size:-128M}"
      TZ: UTC
    tmpfs:
      - /monero/wallets:rw,nosuid,nodev,noexec,mode=0700,uid=${monero_container_uid:-1000},gid=${monero_container_gid:-1000},size=${wallet_vault_size:-128M}
      - /tmp:rw,nosuid,nodev,noexec,mode=1777
      - /tmp/home:rw,nosuid,nodev,noexec,mode=0700,uid=${monero_container_uid:-1000},gid=${monero_container_gid:-1000}
    volumes:
      - "${wallet_store_host_dir:-/tmp/mgla-wallets}:/monero/vault-store:rw"
    healthcheck:
      test: ["CMD", "/opt/monero/monero-wallet-cli", "--version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    depends_on:
      - haproxy
    networks:
      internal_network:
        ipv4_address: ${int_network_container_app_ipv4:?}

  bitcoin:
    <<: *mgla-vault-resources
    profiles: ["bitcoin"]
    container_name: ${bitcoin_container:-mgla-bitcoin}
    image: ${bitcoin_image:-mgla-bitcoin:latest}
    logging:
      driver: "none"
    build:
      context: ./bitcoin
      dockerfile: Dockerfile
      additional_contexts:
        shared: ./shared
      args:
        ALPINE_VERSION: "${alpine_version:-3.24}"
        ELECTRUM_VERSION: "${electrum_version:-4.8.2}"
        ELECTRUM_ARCHIVE_SHA256: "${electrum_archive_sha256:-f38cee333c866986cdfb304428fa7487affc429c3853fc80e9822bd420bbc229}"
    init: true
    stop_signal: SIGTERM
    stop_grace_period: 10s
    user: "${bitcoin_container_uid:-1000}:${bitcoin_container_gid:-1000}"
    cap_drop: ["ALL"]
    read_only: true
    ipc: none
    pids_limit: 128
    cpus: "1.0"
    security_opt:
      - no-new-privileges:true
    environment:
      HAPROXY_IP: "${int_network_container_haproxy_ipv4:?}"
      HOME: /home/electrum
      ELECTRUMDIR: /home/electrum/.electrum/bitcoin
      WALLET_VAULT_HOST_DIR: "${wallet_store_host_dir:-/tmp/mgla-wallets}"
      WALLET_VAULT_SIZE: "${wallet_vault_size:-128M}"
      TZ: UTC
    tmpfs:
      - /home/electrum/.electrum:rw,nosuid,nodev,noexec,mode=0700,uid=${bitcoin_container_uid:-1000},gid=${bitcoin_container_gid:-1000},size=${wallet_vault_size:-128M}
      - /tmp:rw,nosuid,nodev,noexec,mode=1777
      - /run:rw,nosuid,nodev,noexec,mode=0755
    volumes:
      - "${wallet_store_host_dir:-/tmp/mgla-wallets}:/bitcoin/vault-store:rw"
    healthcheck:
      test: ["CMD", "/opt/venv/bin/electrum", "--offline", "--version"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 10s
    depends_on:
      - haproxy
    networks:
      internal_network:
        ipv4_address: ${int_network_container_app_ipv4:?}

networks:
  external_network:
    driver: bridge
    ipam:
      config:
        - subnet: ${ext_network_container_subnet_cidr_ipv4:?}
          gateway: ${ext_network_container_gateway_ipv4:?}
  internal_network:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: ${int_network_container_subnet_cidr_ipv4:?}
          gateway: ${int_network_container_gateway_ipv4:?}

volumes:
  exit_a_run:
  exit_b_run:
