services:
  exit_a:
    container_name: ${exit_a_container}
    image: ${exit_image:-mgla-exit:latest}
    build:
      context: ./docker/exit
      dockerfile: Dockerfile
    init: true
    stop_signal: SIGTERM
    stop_grace_period: 5s
    cap_drop: ["ALL"]
    read_only: true
    ipc: none
    security_opt:
      - no-new-privileges:true
    environment:
      EXIT_IP: "${int_network_container_exit_a_ipv4}"
      HAPROXY_IP: "${int_network_container_haproxy_ipv4}"
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,mode=1777
      - /var/lib/tor:rw,nosuid,nodev,noexec,mode=1777
    volumes:
      - exit_a_run:/run/tor
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck"]
      interval: 30s
      timeout: 15s
      retries: 8
      start_period: 180s
    networks:
      external_network:
        ipv4_address: ${ext_network_container_exit_a_ipv4}
      internal_network:
        ipv4_address: ${int_network_container_exit_a_ipv4}

  exit_b:
    container_name: ${exit_b_container}
    image: ${exit_image:-mgla-exit:latest}
    init: true
    stop_signal: SIGTERM
    stop_grace_period: 5s
    cap_drop: ["ALL"]
    read_only: true
    ipc: none
    security_opt:
      - no-new-privileges:true
    environment:
      EXIT_IP: "${int_network_container_exit_b_ipv4}"
      HAPROXY_IP: "${int_network_container_haproxy_ipv4}"
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,mode=1777
      - /var/lib/tor:rw,nosuid,nodev,noexec,mode=1777
    volumes:
      - exit_b_run:/run/tor
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck"]
      interval: 30s
      timeout: 15s
      retries: 8
      start_period: 180s
    networks:
      external_network:
        ipv4_address: ${ext_network_container_exit_b_ipv4}
      internal_network:
        ipv4_address: ${int_network_container_exit_b_ipv4}

  haproxy:
    container_name: ${haproxy_container}
    image: ${haproxy_image:-mgla-haproxy:latest}
    build:
      context: ./docker/haproxy
      dockerfile: Dockerfile
    init: true
    stop_signal: SIGTERM
    stop_grace_period: 2s
    cap_drop: ["ALL"]
    read_only: true
    ipc: none
    pids_limit: 100
    security_opt:
      - no-new-privileges:true
    environment:
      HAPROXY_IP: "${int_network_container_haproxy_ipv4}"
      EXIT_A_IP: "${int_network_container_exit_a_ipv4}"
      EXIT_B_IP: "${int_network_container_exit_b_ipv4}"
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,mode=1777
      - /run:rw,nosuid,nodev,noexec,mode=0755
    depends_on:
      - exit_a
      - exit_b
    volumes:
      - exit_a_run:/run/tor_a:ro
      - exit_b_run:/run/tor_b:ro
    networks:
      internal_network:
        ipv4_address: ${int_network_container_haproxy_ipv4}

  monero:
    container_name: ${monero_container}
    image: ${monero_image:-mgla-monero:latest}
    build:
      context: ./docker/monero
      dockerfile: Dockerfile
      args:
        MONERO_VERSION: "${monero_version}"
        MONERO_COMMIT: "${monero_commit}"
    init: true
    stop_signal: SIGTERM
    stop_grace_period: 2s
    cap_drop: ["ALL"]
    read_only: true
    ipc: none
    pids_limit: 128
    mem_limit: 512m
    cpus: "1.0"
    security_opt:
      - no-new-privileges:true
    environment:
      HAPROXY_IP: "${int_network_container_haproxy_ipv4}"
      HOME: /tmp/home
      WALLET_HOST_DIR: "${wallet_host_dir}"
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,mode=1777
      - /tmp/home:rw,nosuid,nodev,noexec,mode=0700,uid=1000,gid=1000
    volumes:
      - "${wallet_host_dir}:/monero/wallets:rw"
    healthcheck:
      test: ["CMD", "/opt/monero/monero-wallet-cli", "--version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    depends_on:
      - haproxy
    networks:
      internal_network:
        ipv4_address: ${int_network_container_app_ipv4}

networks:
  external_network:
    driver: bridge
    ipam:
      config:
        - subnet: ${ext_network_container_subnet_cidr_ipv4}
          gateway: ${ext_network_container_gateway_ipv4}
  internal_network:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: ${int_network_container_subnet_cidr_ipv4}
          gateway: ${int_network_container_gateway_ipv4}

volumes:
  exit_a_run:
  exit_b_run:
